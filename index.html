<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Culebrita</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #eee;
    padding: 10px;
    touch-action: none;
    user-select: none;
  }
  h1 { margin: 5px 0; color: #4ade80; font-size: 1.8rem; }
  #scoreBoard {
    display: flex;
    gap: 20px;
    margin-bottom: 8px;
    font-size: 1.1rem;
  }
  #scoreBoard span { color: #4ade80; font-weight: bold; }
  #gameCanvas {
    background: #16213e;
    border: 3px solid #4ade80;
    border-radius: 8px;
    max-width: 95vw;
    max-height: 55vh;
    touch-action: none;
  }
  #message {
    margin-top: 10px;
    font-size: 1.1rem;
    min-height: 24px;
    color: #f87171;
    text-align: center;
  }
  #controls {
    display: none;
    margin-top: 15px;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 6px;
  }
  #controls button {
    background: #4ade80;
    border: none;
    border-radius: 10px;
    font-size: 1.5rem;
    color: #16213e;
    font-weight: bold;
    touch-action: manipulation;
  }
  #controls button:active { background: #22c55e; }
  #btnUp { grid-column: 2; grid-row: 1; }
  #btnLeft { grid-column: 1; grid-row: 2; }
  #btnDown { grid-column: 2; grid-row: 2; }
  #btnRight { grid-column: 3; grid-row: 2; }
  #btnStart {
    margin-top: 12px;
    padding: 10px 25px;
    background: #4ade80;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    color: #16213e;
    cursor: pointer;
  }
  #btnStart:active { background: #22c55e; }
  #hint { font-size: 0.85rem; color: #aaa; margin-top: 5px; text-align: center; }

  @media (hover: none) and (pointer: coarse) {
    #controls { display: grid; }
  }
</style>
</head>
<body>

<h1>🐍 Culebrita</h1>
<div id="scoreBoard">
  <div>Puntos: <span id="score">0</span></div>
  <div>Mejor: <span id="highScore">0</span></div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="message"></div>
<button id="btnStart">Iniciar juego</button>
<div id="hint">PC: usa las flechas o WASD · Móvil: desliza el dedo o usa los botones</div>

<div id="controls">
  <button id="btnUp">▲</button>
  <button id="btnLeft">◀</button>
  <button id="btnDown">▼</button>
  <button id="btnRight">▶</button>
</div>

<script>
(function () {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const messageEl = document.getElementById('message');
  const btnStart = document.getElementById('btnStart');

  const GRID_SIZE = 20; // tamaño de cada celda en px
  let cols, rows;

  function resizeCanvas() {
    // Tamaño responsivo: cuadrícula que quepa en pantalla, múltiplo de GRID_SIZE
    const maxW = Math.min(window.innerWidth * 0.95, 500);
    const maxH = Math.min(window.innerHeight * 0.55, 500);
    cols = Math.floor(maxW / GRID_SIZE);
    rows = Math.floor(maxH / GRID_SIZE);
    canvas.width = cols * GRID_SIZE;
    canvas.height = rows * GRID_SIZE;
  }

  let snake, direction, nextDirection, food, score, highScore, gameRunning, gameLoop;
  let speed = 130; // ms entre movimientos

  highScore = parseInt(localStorage.getItem('culebrita_highscore') || '0', 10);
  highScoreEl.textContent = highScore;

  function initGame() {
    resizeCanvas();
    snake = [
      { x: Math.floor(cols / 2), y: Math.floor(rows / 2) }
    ];
    direction = { x: 0, y: 0 };
    nextDirection = { x: 0, y: 0 };
    score = 0;
    scoreEl.textContent = score;
    speed = 130;
    placeFood();
    draw();
  }

  function placeFood() {
    let valid = false;
    while (!valid) {
      food = {
        x: Math.floor(Math.random() * cols),
        y: Math.floor(Math.random() * rows)
      };
      valid = !snake.some(seg => seg.x === food.x && seg.y === food.y);
    }
  }

  function draw() {
    ctx.fillStyle = '#16213e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // comida
    ctx.fillStyle = '#f87171';
    ctx.beginPath();
    ctx.arc(
      food.x * GRID_SIZE + GRID_SIZE / 2,
      food.y * GRID_SIZE + GRID_SIZE / 2,
      GRID_SIZE / 2.5, 0, Math.PI * 2
    );
    ctx.fill();

    // culebrita
    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
      ctx.fillRect(
        seg.x * GRID_SIZE + 1,
        seg.y * GRID_SIZE + 1,
        GRID_SIZE - 2,
        GRID_SIZE - 2
      );
    });
  }

  function update() {
    if (nextDirection.x !== 0 || nextDirection.y !== 0) {
      // evita que se mueva en reversa sobre sí misma
      if (!(nextDirection.x === -direction.x && nextDirection.y === -direction.y)) {
        direction = nextDirection;
      }
    }

    if (direction.x === 0 && direction.y === 0) return; // aún no empieza

    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    // colisión con paredes
    if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
      return endGame();
    }
    // colisión consigo misma
    if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
      return endGame();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      placeFood();
      // acelera un poco cada 5 puntos
      if (score % 5 === 0 && speed > 60) {
        speed -= 8;
        clearInterval(gameLoop);
        gameLoop = setInterval(tick, speed);
      }
    } else {
      snake.pop();
    }

    draw();
  }

  function tick() {
    update();
  }

  function endGame() {
    clearInterval(gameLoop);
    gameRunning = false;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('culebrita_highscore', highScore);
      highScoreEl.textContent = highScore;
      messageEl.textContent = `¡Nuevo récord! Puntuación: ${score} 🎉`;
    } else {
      messageEl.textContent = `Juego terminado. Puntuación: ${score}`;
    }
    btnStart.textContent = 'Jugar de nuevo';
    btnStart.style.display = 'inline-block';
  }

  function startGame() {
    initGame();
    gameRunning = true;
    messageEl.textContent = '';
    btnStart.style.display = 'none';
    clearInterval(gameLoop);
    gameLoop = setInterval(tick, speed);
  }

  btnStart.addEventListener('click', startGame);

  // --- Controles de teclado (PC) ---
  function setDirection(dx, dy) {
    if (!gameRunning) return;
    nextDirection = { x: dx, y: dy };
  }

  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W':
        e.preventDefault(); setDirection(0, -1); break;
      case 'ArrowDown': case 's': case 'S':
        e.preventDefault(); setDirection(0, 1); break;
      case 'ArrowLeft': case 'a': case 'A':
        e.preventDefault(); setDirection(-1, 0); break;
      case 'ArrowRight': case 'd': case 'D':
        e.preventDefault(); setDirection(1, 0); break;
    }
  });

  // --- Controles táctiles: botones ---
  document.getElementById('btnUp').addEventListener('click', () => setDirection(0, -1));
  document.getElementById('btnDown').addEventListener('click', () => setDirection(0, 1));
  document.getElementById('btnLeft').addEventListener('click', () => setDirection(-1, 0));
  document.getElementById('btnRight').addEventListener('click', () => setDirection(1, 0));

  // --- Controles táctiles: deslizar (swipe) sobre el canvas ---
  let touchStartX = 0, touchStartY = 0;

  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);
    const minSwipe = 20;

    if (Math.max(absDx, absDy) < minSwipe) return;

    if (absDx > absDy) {
      setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      setDirection(0, dy > 0 ? 1 : -1);
    }
  }, { passive: true });

  window.addEventListener('resize', () => {
    if (!gameRunning) {
      initGame();
    }
  });

  // Estado inicial en pantalla
  resizeCanvas();
  cols = cols || 20;
  rows = rows || 20;
  snake = [{ x: Math.floor(cols / 2), y: Math.floor(rows / 2) }];
  food = { x: 5, y: 5 };
  draw();
})();
</script>

</body>
</html>
